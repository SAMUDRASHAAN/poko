name: CI

on:
  push: { branches: [main] }
  pull_request:
  # The full solvability gate runs nightly as well as on main, so the sampled
  # pull-request tier can never be the last word on INV-6.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }

      - uses: actions/setup-node@v4
        with:
          # >=22.5 for the built-in `node:sqlite`, which packages/client-data uses
          # to test its schema against real SQLite rather than a fake.
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Ordered cheapest-to-most-expensive so failures surface fast.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      # INV-1, INV-2: architecture boundaries are not advisory.
      - name: Architecture boundaries
        run: pnpm depcruise

      - name: Unit tests + coverage thresholds
        run: pnpm test

      - name: Dead code
        run: pnpm knip

      # `pnpm fuzz` runs in its own `fuzz` job below, not here.

      # INV-12: no third-party analytics or ad SDK may enter the client.
      - name: Forbidden dependency audit
        run: |
          if pnpm ls --depth=Infinity --json 2>/dev/null | grep -Eiq '"(firebase-analytics|react-native-google-mobile-ads|appsflyer|amplitude|mixpanel|facebook-sdk|branch-sdk)"'; then
            echo "::error::INV-12 violation: a third-party analytics or ads SDK is present."
            exit 1
          fi
          echo "No forbidden SDKs found."

  flutter_verify:
    name: flutter verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install parity toolchain
        run: pnpm install --frozen-lockfile

      - name: Resolve locked workspace
        working-directory: flutter
        run: flutter pub get --enforce-lockfile

      - name: Analyze, audit, and test
        working-directory: flutter
        run: dart run tool/verify_workspace.dart

      - name: Cross-language fixture parity
        run: pnpm --filter @poko/parity verify

      - name: Full cross-language corpus and Dart performance
        env:
          PARITY_RUNS: '100000'
        run: pnpm --filter @poko/parity corpus

      - name: Build arm64 release APK
        working-directory: flutter/apps/mobile
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Audit offline arm64 artifact
        working-directory: flutter/apps/mobile
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if grep -Rqs 'android.permission.INTERNET' build/app/intermediates/merged_manifest/release; then
            echo "::error::Release app unexpectedly requests INTERNET permission."
            exit 1
          fi
          abis=$(unzip -l "$apk" | awk '/lib\/.+\.so$/ {print $4}' | cut -d/ -f2 | sort -u)
          if [ "$abis" != "arm64-v8a" ]; then
            echo "::error::Expected only arm64-v8a native libraries; found: $abis"
            exit 1
          fi
          shasum -a 256 "$apk"

      - name: Build Macrobenchmark artifacts
        working-directory: flutter/apps/mobile/android
        run: >-
          ./gradlew :app:assembleBenchmark :macrobenchmark:assembleBenchmark
          -Ptarget-platform=android-arm64

  # INV-6: no generated board may be unsolvable.
  #
  # This job is a REQUIRED check. Phase 1 replaced the typed generator/solver
  # stubs, so every failure is now blocking.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tiered: a sample on every pull request, the full corpus on main and nightly.
    #
    # The full 100k run takes ~7 minutes. Paying that on each pull-request push
    # makes the gate something people work around rather
    # than with, and Phase 2 adds a device-performance job on top of it. A 10k
    # sample still catches systematic INV-6 breakage within about a minute; the
    # rare-case coverage moves to main and to the nightly schedule, where a slow
    # job costs nobody's review cycle.
    #
    # The job NAME must stay `fuzz` — branch protection matches on it.
    env:
      FUZZ_RUNS: ${{ github.event_name == 'pull_request' && '10000' || '100000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }

      - uses: actions/setup-node@v4
        with:
          # >=22.5 for the built-in `node:sqlite`, which packages/client-data uses
          # to test its schema against real SQLite rather than a fake.
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Solvability fuzz gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice title=Fuzz tier::Sampled tier — $FUZZ_RUNS boards. The full 100k corpus runs on main and nightly."
          else
            echo "Full tier — $FUZZ_RUNS boards."
          fi
          pnpm fuzz

  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from origin/main --to HEAD --verbose
