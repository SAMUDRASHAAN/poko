name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Ordered cheapest-to-most-expensive so failures surface fast.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      # INV-1, INV-2: architecture boundaries are not advisory.
      - name: Architecture boundaries
        run: pnpm depcruise

      - name: Unit tests + coverage thresholds
        run: pnpm test

      - name: Dead code
        run: pnpm knip

      # `pnpm fuzz` becomes required at GATE 1, once Phase 1 has implemented
      # generator + solver. Phase 0 intentionally ships typed stubs for them.

      # INV-12: no third-party analytics or ad SDK may enter the client.
      - name: Forbidden dependency audit
        run: |
          if pnpm ls --depth=Infinity --json 2>/dev/null | grep -Eiq '"(firebase-analytics|react-native-google-mobile-ads|appsflyer|amplitude|mixpanel|facebook-sdk|branch-sdk)"'; then
            echo "::error::INV-12 violation: a third-party analytics or ads SDK is present."
            exit 1
          fi
          echo "No forbidden SDKs found."

  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from origin/main --to HEAD --verbose
