name: CI

on:
  push: { branches: [main] }
  pull_request:
  # The full solvability gate runs nightly as well as on main, so the sampled
  # pull-request tier can never be the last word on INV-6.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Ordered cheapest-to-most-expensive so failures surface fast.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      # INV-1, INV-2: architecture boundaries are not advisory.
      - name: Architecture boundaries
        run: pnpm depcruise

      - name: Unit tests + coverage thresholds
        run: pnpm test

      - name: Dead code
        run: pnpm knip

      # `pnpm fuzz` runs in its own `fuzz` job below, not here.

      # INV-12: no third-party analytics or ad SDK may enter the client.
      - name: Forbidden dependency audit
        run: |
          if pnpm ls --depth=Infinity --json 2>/dev/null | grep -Eiq '"(firebase-analytics|react-native-google-mobile-ads|appsflyer|amplitude|mixpanel|facebook-sdk|branch-sdk)"'; then
            echo "::error::INV-12 violation: a third-party analytics or ads SDK is present."
            exit 1
          fi
          echo "No forbidden SDKs found."

  # INV-6: no generated board may be unsolvable.
  #
  # This job is a REQUIRED check from Phase 0 onward, but it cannot pass yet:
  # generator and solver ship as typed stubs that throw NotImplementedError, so
  # `pnpm fuzz` currently fails on every board. Rather than leave the gate
  # unwired until someone remembers to turn it on at Gate 1, the job tolerates
  # exactly one failure mode — NotImplementedError — and blocks on every other.
  #
  # The moment Phase 1 replaces those stubs, that failure mode disappears and the
  # job becomes genuinely blocking with no configuration change. There is no
  # checklist step to forget.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tiered: a sample on every pull request, the full corpus on main and nightly.
    #
    # The full 100k run takes ~7 minutes, and it is a required check on every PR.
    # Paying that on each push makes the gate something people work around rather
    # than with, and Phase 2 adds a device-performance job on top of it. A 10k
    # sample still catches systematic INV-6 breakage within about a minute; the
    # rare-case coverage moves to main and to the nightly schedule, where a slow
    # job costs nobody's review cycle.
    #
    # The job NAME must stay `fuzz` — branch protection matches on it.
    env:
      FUZZ_RUNS: ${{ github.event_name == 'pull_request' && '10000' || '100000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Solvability fuzz gate
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice title=Fuzz tier::Sampled tier — $FUZZ_RUNS boards. The full 100k corpus runs on main and nightly."
          else
            echo "Full tier — $FUZZ_RUNS boards."
          fi

          output=$(pnpm fuzz 2>&1)
          code=$?
          echo "$output"

          if [ $code -eq 0 ]; then
            echo "INV-6 holds across the fuzz corpus."
            exit 0
          fi

          if echo "$output" | grep -q 'is not implemented yet (Phase 1)'; then
            echo "::warning title=INV-6 gate pending::generator/solver are still Phase 0 stubs, so the fuzz gate cannot run for real yet. This job starts blocking automatically once they are implemented — no config change needed."
            exit 0
          fi

          echo "::error title=INV-6 violation::pnpm fuzz failed for a reason other than an unimplemented stub."
          exit $code

  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from origin/main --to HEAD --verbose
